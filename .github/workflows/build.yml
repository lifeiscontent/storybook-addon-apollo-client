name: Build

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      matrix:
        node-version: [22.12, 24.21]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check for linter errors
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      matrix:
        node-version: [22.12, 24.21]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build addon
        run: pnpm build

      - name: Check package
        run: pnpm lint:package

      - name: Check release requirements
        run: pnpm prerelease

      - name: Build Storybook
        run: pnpm build-storybook

  test:
    name: test (Node ${{ matrix.node-version }}, Storybook ${{ matrix.storybook }})
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Storybook version in the lockfile
          - node-version: 22.12
            storybook: lockfile
          - node-version: 24.21
            storybook: lockfile
          # The latest Storybook 10
          - node-version: 24.21
            storybook: ^10
            vitest: ^5
          # The lowest Storybook version in the peer range. Its Vitest addon
          # supports Vitest 4 and lower.
          - node-version: 24.21
            storybook: 10.1.0
            vitest: ^4
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Use Storybook ${{ matrix.storybook }}
        if: matrix.storybook != 'lockfile'
        run: >-
          pnpm add -D
          storybook@${{ matrix.storybook }}
          @storybook/react-vite@${{ matrix.storybook }}
          @storybook/addon-docs@${{ matrix.storybook }}
          @storybook/addon-vitest@${{ matrix.storybook }}
          eslint-plugin-storybook@${{ matrix.storybook }}
          vitest@${{ matrix.vitest }}
          @vitest/browser-playwright@${{ matrix.vitest }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check types
        run: pnpm typecheck

      - name: Build addon
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Build Storybook
        if: matrix.storybook != 'lockfile'
        run: pnpm build-storybook
